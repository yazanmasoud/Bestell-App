<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>

    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/meals.css">
    <link rel="stylesheet" href="./styles/basket.css">

    <script src="script.js" defer></script>
    <script src="scripts/food.js" defer></script>
    <script src="scripts/template.js" defer></script>
    <link rel="icon" href="./logos/burgerLogo.png">
</head>

<body onload="init()">

    <header class="site-header">
        <div class="content header-logo-menu">
            <img src="./logos/Logo-bestellapp.svg" alt="Page Logo">
            <button class="menu-button">
                <img src="./buttons/menu.svg" alt="menu button">
            </button>
        </div>
    </header>
    <main class="site-main">

        <button class="basket-button-icon" onclick="toggleBasket()"><img src="./assets/icons/shopping_cart.svg"
                alt=""></button>
        <img class="basket-count" src="./assets/icons/Ellipse.svg" alt="">

        <div class="hero">
            <div class="hero-image">
                <img class="main-image" src="./assets/images/mainImage.png" alt="">
                <img class="burger-logo" src="./logos/burgerLogo.png" alt="">
            </div>
            <img src="./assets/images/restaurantNameImage.png" alt="Name of the restaurant">
        </div>

        <section class="bar-slider">
            <div class="bar-slider-inner content">
                <a href="#burger-sandwiches"><span>Burger & Sandwiches</span></a>
                <a href="#pizza"><span>Pizza</span></a>
                <a href="#salad"><span>Salad</span></a>
            </div>
        </section>
        <section id="meal-category"></section>

        <div class="meals-and-basket content">
            <section class="meals" id="meals"></section>

            <aside class="basket content" id="basket-site">
                <h2 class="basket-title">Your Basket
                    <button onclick="closeBasket()" class="basket-close-button"><img class="exit-icon" src="./assets/icons/icons8-exit-50.png" alt="exit header icon"></button>
                </h2>
                <section class="basket-content" id="basket"></section>
                <section class="basket-price" id="order-price"></section>
            </aside>
        </div>

    </main>

    <footer class="site-footer"></footer>

</body>

</html>
