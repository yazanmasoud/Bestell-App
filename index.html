<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="styles/standard.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="scripts/food.js" defer></script>
    <script src="scripts/template.js" defer></script>
</head>

<body onload="init()">
    <header class="SiteHeader">
        <div class="Content HeaderLogoMenu">
            <img src="./logos/Logo-bestellapp.svg" alt="Page Logo">
            <button class="MenuButton"><img src="./buttons/menu.svg" alt="menu button"></button>
        </div>
    </header>

    <main  class="SiteMain">
        <div class="HeroImages">
            <img class="MainImage" src="./assets/images/mainImage.png" alt="Pizza and Burger image">
            <img class="BurgerLogo" src="./logos/burgerLogo.png" alt="burger logo">
        </div>
        <section id="meal-category">

        </section>
    </main>

    <footer class="SiteFooter">

    </footer>
</body>

</html>
